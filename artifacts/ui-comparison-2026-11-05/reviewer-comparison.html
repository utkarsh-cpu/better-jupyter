<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font-family:var(--font-sans,system-ui);color:var(--foreground)}*{box-sizing:border-box}body{margin:0}label,select{font-size:13px}select{font:inherit;color:inherit;background:var(--secondary);border:1px solid var(--border);padding:7px 10px;border-radius:6px;margin-left:8px}select:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.totals{display:flex;gap:12px;margin:16px 0}.card{flex:1;background:var(--card);border-radius:var(--radius);padding:16px}.card p{font-size:13px;margin:0}.card strong{display:block;font-size:28px;line-height:1.5}.legend{font-size:12px;display:flex;gap:20px;margin-bottom:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.m{background:var(--chart-1)}.k{background:var(--chart-2)}.chart{height:500px}.row{display:grid;grid-template-columns:146px 1fr;gap:10px;align-items:center;height:47px}.name{font-size:12px}.tracks{display:grid;gap:4px}.track{height:15px;margin-right:34px;background:var(--secondary);position:relative;border-radius:3px}.bar{height:15px;border-radius:3px}.score{position:absolute;left:calc(100% + 8px);font-size:12px;line-height:15px;top:0}.axis{display:flex;justify-content:space-between;margin-left:156px;margin-right:34px;font-size:11px;color:var(--muted-foreground)}.note{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin:8px 0}.sum{font-size:12px;margin-bottom:8px}@media(max-width:480px){.row{grid-template-columns:115px 1fr}.axis{margin-left:125px}.card{padding:16px}.card strong{font-size:25px}}</style></head><body><label for="reviewer">Reviewer</label><select id="reviewer"><option value="grok">Grok 4.7 · xhigh</option><option value="original">Earlier Codex review</option></select><div class="totals"><div class="card"><p>Marimo</p><strong id="mtotal">7.3 / 10</strong></div><div class="card"><p>KernelLedger</p><strong id="ktotal">7.7 / 10</strong></div></div><div class="legend"><span><i class="dot m"></i>Marimo</span><span><i class="dot k"></i>KernelLedger</span></div><div id="chart" class="chart" role="img"></div><p class="sum" id="sums"></p><p class="note">Ten equally weighted subjective ratings of the same saved screenshots. Grok viewed the images before reading the earlier review. No fresh execution or user task study. Different settings pages and traceback states limit the comparison.</p><script>const data={"labels":["Visual polish","Text readability","Visual hierarchy","Space efficiency","Navigation clarity","Action discoverability","Execution feedback","Error experience","Settings usability","800 × 600 layout"],"grok":{"marimo":[7.5,7.5,7.5,6.5,6.5,7,8,7.5,8,6.5],"kernel":[7.5,8,8,7,8,8,7.5,7.5,7.5,7.5]},"original":{"marimo":[8,7,8,8,6.5,6.5,8.5,8,8,7],"kernel":[7.5,8.5,8,7,8.5,8,8,8.5,8.5,8]},"method":"Ten equally weighted subjective scores. Grok 4.7 xhigh independently reviewed previously captured PNGs; no fresh execution. Round half-up to one decimal. Unmatched disclosure states and settings pages limit comparative conclusions."};function draw(){const d=data[document.getElementById('reviewer').value],s=a=>a.reduce((x,y)=>x+y,0),avg=a=>(Math.round(s(a))/10).toFixed(1);document.getElementById('mtotal').textContent=avg(d.marimo)+' / 10';document.getElementById('ktotal').textContent=avg(d.kernel)+' / 10';const c=document.getElementById('chart');c.setAttribute('aria-label',data.labels.map((l,i)=>l+': Marimo '+d.marimo[i]+', KernelLedger '+d.kernel[i]).join('; '));c.innerHTML=data.labels.map((l,i)=>'<div class="row"><span class="name">'+l+'</span><div class="tracks">'+[['m',d.marimo[i]],['k',d.kernel[i]]].map(([app,v])=>'<div class="track"><div class="bar '+app+'" style="width:'+v*10+'%"></div><span class="score">'+v.toFixed(1)+'</span></div>').join('')+'</div></div>').join('')+'<div class="axis"><span>0</span><span>5</span><span>10</span></div>';document.getElementById('sums').textContent='Unrounded means: Marimo '+s(d.marimo)+'/10 = '+(s(d.marimo)/10)+'; KernelLedger '+s(d.kernel)+'/10 = '+(s(d.kernel)/10)+'. Display rounded half-up.'}document.getElementById('reviewer').addEventListener('change',draw);draw();</script></body></html>
