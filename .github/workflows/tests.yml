name: Tests
on: [push, pull_request]
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
        codecs: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.codecs
        run: python -m pip install -e ".[codecs,plots]"
      - run: python -m pytest -q
      - run: python scripts/runtime_inventory.py --check
      - run: python scripts/runtime_contracts.py --check
      - run: python -m ruff check src tests examples/worktrees
      - run: python -m ruff format --check src tests examples/worktrees
      - run: python -m pyright
  desktop-client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p kernelledger-client -p kernelledger-models -p kernelledger-protocol -p kernelledger-runtime -p kernelledger-daemon
      - run: cargo clippy --locked -p kernelledger-client -p kernelledger-models -p kernelledger-protocol -p kernelledger-runtime -p kernelledger-daemon --all-targets -- -D warnings
  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: clippy
      - run: python -m pip install -e ..
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p kernelledger-desktop -p kernelledger-daemon
      - run: python ../scripts/desktop_smoke.py
      - name: Native UI service integration
        env:
          KERNELLEDGER_RUNTIME: native
          KERNELLEDGER_HELPER: native
          KERNELLEDGER_DAEMON: ${{ github.workspace }}/desktop/target/debug/kernelledger-daemon.exe
        run: |
          python ../scripts/desktop_smoke.py
          python ../scripts/desktop_lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: kernelledger-windows-development
          path: desktop/target/debug/kernelledger-desktop.exe
