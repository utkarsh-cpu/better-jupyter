[workspace]
members = ["crates/app", "crates/ui", "crates/client", "crates/models", "crates/protocol", "crates/runtime", "crates/daemon"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-python"] }
gpui = { package = "gpui-pre", version = "=0.3.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4", "serde"] }
anyhow = "1.0"
keyring = { version = "=3.6.3", features = ["windows-native", "sync-secret-service"] }
smol = "2.0"
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
kernelledger-client = { path = "crates/client" }
kernelledger-models = { path = "crates/models" }
kernelledger-ui = { path = "crates/ui" }
kernelledger-protocol = { path = "crates/protocol" }
kernelledger-runtime = { path = "crates/runtime" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
