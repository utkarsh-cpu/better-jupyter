[package]
name = "kernelledger-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
uuid.workspace = true
kernelledger-protocol.workspace = true
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.22"

[build-dependencies]
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }
