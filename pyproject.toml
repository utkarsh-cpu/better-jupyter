[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelledger"
version = "0.1.0"
description = "Source notebooks, durable execution history, and typed Python checkpoints"
requires-python = ">=3.11"
dependencies = ["markdown-it-py>=3,<5", "python-docx>=1.2,<2", "reportlab>=4.4,<5"]

[project.scripts]
kl = "kernelledger.cli:main"

[project.entry-points."kernelledger.checkpoint_plugins"]
pytorch = "kernelledger.gpu.cooperative:CooperativeCheckpointPlugin"

[project.optional-dependencies]
codecs = ["numpy", "pandas", "pyarrow"]
plots = ["matplotlib"]
gpu = [
    "torch==2.12.0",
    "numpy==2.5.2; python_version >= '3.12'",
    "numpy>=2,<2.5; python_version < '3.12'",
]
dev = ["pytest", "hypothesis", "jsonschema", "ruff", "pyright", "pypdf>=5,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/kernelledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]
